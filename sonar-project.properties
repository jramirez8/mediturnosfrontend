sonar.organization=jramirez8
sonar.projectKey=jramirez8_mediturnosfrontend
sonar.projectName=Mediturnos Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts
sonar.exclusions=coverage/**,dist/**,web-build/**,.expo/**,node_modules/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json

# Sonar analiza toda la aplicación. Coverage se concentra en lógica pura y reglas de negocio;
# las pantallas, navegación, wrappers HTTP y adaptadores nativos se validan por typecheck/E2E.
sonar.coverage.exclusions=src/api/**,src/app/**,src/assets/**,src/auth/**,src/components/**,src/constants/**,src/context/**,src/db/**,src/hooks/**,src/i18n/**,src/theme/**,src/types/**,src/README.md,src/utils/calendar.ts,src/utils/deviceAuth.ts,src/utils/mediaPicker.ts,src/utils/session.ts

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
